[package]
name = "py-crude-resource-monitor"
version = "0.4.0"
edition = "2024"
license = "MIT"

[features]
unwind = ["py-spy/unwind"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
py-spy = { git = "https://github.com/I-Al-Istannen/py-spy", rev = "1100be284900a2bb393c687a33ba42bcbb640ad6" }
serde_json = "1.0.154"
sysinfo = "0.40.1"
serde = { version = "1.0.229", features = ["derive"] }
dialoguer = "0.12.0"
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
rust-embed = "8.13.0"
mime_guess = "2.0.5"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
snafu = { version = "0.9.2", features = ["std"] }
flate2 = "1.1.10"
base64 = "0.23.1"
ctrlc = "3.5.2"
fxprof-processed-profile = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
users = "0.11.0"
shlex = "2.0.1"

[lints]
rust.unsafe_code = { level = "deny", priority = 1 }
# Lint groups
rust.deprecated_safe = "warn"
rust.future_incompatible = "warn"
rust.keyword_idents = "warn"
rust.rust_2018_idioms = "warn"
rust.unused = "warn"
# Individual lints
rust.non_local_definitions = "warn"
rust.redundant_imports = "warn"
rust.redundant_lifetimes = "warn"
rust.single_use_lifetimes = "warn"
rust.unit_bindings = "warn"
rust.unused_crate_dependencies = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_qualifications = "warn"
# Clippy
clippy.use_self = "warn"
clippy.result_large_err = "allow"

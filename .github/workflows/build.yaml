name: Build
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pkgconfig dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev build-essential liblzma-dev -y
          echo 'RUSTFLAGS=-C link-arg=-llzma' >> $GITHUB_ENV

      - name: Test frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features unwind -- -D warnings

      - name: Test
        run: cargo test --features unwind

  build:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            unwind: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            unwind: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            unwind: false
          - target: aarch64-apple-darwin
            os: macos-latest
            unwind: false
          - target: x86_64-apple-darwin
            os: macos-latest
            unwind: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pkgconfig dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev build-essential liblzma-dev -y
          echo 'RUSTFLAGS=-C link-arg=-llzma' >> $GITHUB_ENV

      - name: Build
        run: |
          cargo build --release ${{ matrix.unwind && '--features unwind' || '' }} --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/py-crude-resource-monitor
            target/${{ matrix.target }}/release/py-crude-resource-monitor.exe

  build-static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Build frontend
        run: |
          # The musl build image has no node, so build.rs can't do this for us
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build musl build image
        run: docker build -t musl-builder -f .github/docker/musl.Dockerfile .github/docker

      - name: Build main program
        run: |
          # We skip the frontend build here, as we already did it and the image has no node
          docker run --rm -v "$PWD:/work" musl-builder \
            bash -c 'cd /work && SKIP_FRONTEND_BUILD=yes cargo build --release --features unwind --target x86_64-unknown-linux-musl'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/py-crude-resource-monitor

name: Build
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pkgconfig dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev build-essential liblzma-dev -y
          echo 'RUSTFLAGS=-C link-arg=-llzma' >> $GITHUB_ENV

      - name: Test frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features unwind -- -D warnings

      - name: Test
        run: cargo test --features unwind

  stress-test-image:
    name: Build Stress Test Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f stress-tests/Dockerfile -t py-crude-resource-monitor-stress .

      - name: Save image
        run: docker save py-crude-resource-monitor-stress | gzip > stress-test-image.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-image
          path: stress-test-image.tar.gz
          # The image is already compressed
          compression-level: 0
          retention-days: 1

  stress-tests:
    name: ${{ matrix.name }}
    needs: stress-test-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Stress Tests
            id: stress-tests
            args: ""
            results: ""
          - name: Real Project (black_django)
            id: real-black-django
            args: "--realworld black_django"
            results: "realworld/"
          - name: Real Project (pip_install)
            id: real-pip-install
            args: "--realworld pip_install"
            results: "realworld/"
          - name: Real Project (pytest_pandas)
            id: real-pytest-pandas
            args: "--realworld pytest_pandas"
            results: "realworld/"
          - name: Real Project (pytest_polars)
            id: real-pytest-polars
            args: "--realworld pytest_polars"
            results: "realworld/"
          - name: Real Project (pytest_sklearn)
            id: real-pytest-sklearn
            args: "--realworld pytest_sklearn"
            results: "realworld/"
          - name: Real Project (pytest_sympy)
            id: real-pytest-sympy
            args: "--realworld pytest_sympy"
            results: "realworld/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stress-test-image

      - name: Load image
        run: gunzip -c stress-test-image.tar.gz | docker load

      - name: Run ${{ matrix.name }}
        env:
          SKIP_IMAGE_BUILD: "yes"
        run: ./stress-tests/run.sh ${{ matrix.args }}

      - name: Add summary
        if: always()
        run: cat stress-tests/results/${{ matrix.results }}summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.id }}-results
          path: stress-tests/results/

  build:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            unwind: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            unwind: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            unwind: false
          - target: aarch64-apple-darwin
            os: macos-latest
            unwind: false
          - target: x86_64-apple-darwin
            os: macos-latest
            unwind: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pkgconfig dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev build-essential liblzma-dev -y
          echo 'RUSTFLAGS=-C link-arg=-llzma' >> $GITHUB_ENV

      - name: Build
        run: |
          cargo build --release ${{ matrix.unwind && '--features unwind' || '' }} --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/py-crude-resource-monitor
            target/${{ matrix.target }}/release/py-crude-resource-monitor.exe

  build-static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Build frontend
        run: |
          # The musl build image has no node, so build.rs can't do this for us
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build musl build image
        run: docker build -t musl-builder -f .github/docker/musl.Dockerfile .github/docker

      - name: Build main program
        run: |
          # We skip the frontend build here, as we already did it and the image has no node
          docker run --rm -v "$PWD:/work" musl-builder \
            bash -c 'cd /work && SKIP_FRONTEND_BUILD=yes cargo build --release --features unwind --target x86_64-unknown-linux-musl'

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/py-crude-resource-monitor
